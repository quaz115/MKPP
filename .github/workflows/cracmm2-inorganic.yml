name: CRACMM2 inorganic thermodynamics

on:
  push:
    paths:
      - 'src/isorropialite'
      - 'src/mkpp_host/CMakeLists.txt'
      - 'src/mkpp_host/include/mkpp_host/cracmm2_inorganic*.hpp'
      - 'tests/integration/cracmm2_inorganic/**'
      - 'tests/integration/e2e_validation/test_e2e_mechanisms.cpp'
      - 'tests/integration/e2e_validation/CMakeLists.txt'
      - 'src/mkpp/**'
      - 'mkpp-generated/cracmm2.hpp'
      - 'mkpp-generated/cracmm2/**'
      - 'scripts/import_cracmm2.py'
      - 'tests/python/test_import_cracmm2.py'
      - 'tests/integration/solver_benchmark/test_extended_mechanisms.py'
      - 'mechanisms/openatmos/cracmm2/mechanism.json'
      - '.github/workflows/cracmm2-inorganic.yml'
  pull_request:
    paths:
      - 'src/isorropialite'
      - 'src/mkpp_host/CMakeLists.txt'
      - 'src/mkpp_host/include/mkpp_host/cracmm2_inorganic*.hpp'
      - 'tests/integration/cracmm2_inorganic/**'
      - 'tests/integration/e2e_validation/test_e2e_mechanisms.cpp'
      - 'tests/integration/e2e_validation/CMakeLists.txt'
      - 'src/mkpp/**'
      - 'mkpp-generated/cracmm2.hpp'
      - 'mkpp-generated/cracmm2/**'
      - 'scripts/import_cracmm2.py'
      - 'tests/python/test_import_cracmm2.py'
      - 'tests/integration/solver_benchmark/test_extended_mechanisms.py'
      - 'mechanisms/openatmos/cracmm2/mechanism.json'
      - '.github/workflows/cracmm2-inorganic.yml'

permissions:
  contents: read

jobs:
  compare-lite:
    runs-on: ubuntu-latest
    container: ghcr.io/bbakernoaa/mkpp-ci-env:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out the CMAQ 5.5.0.4 thermodynamics reference
        uses: actions/checkout@v4
        with:
          repository: USEPA/CMAQ
          ref: 1b70e0a395fc42cc34a4355807d39df1d3dbae84
          path: cmaq-reference
          sparse-checkout: CCTM/src/aero/aero6
          persist-credentials: false
      - name: Check out the standalone ISORROPIA II 2.3 reference
        uses: actions/checkout@v4
        with:
          repository: EPFL-LAPI/ISORROPIA-II
          ref: 17102b249d9279d4565da3c652ea6ef57c3a3b34
          path: epfl-ii-reference
          sparse-checkout: iso_2_3Src
          persist-credentials: false
      - name: Check the CRACMM2 importer and forcing catalog
        env:
          PYTHONPATH: .:src
        run: >-
          python3 -m pytest -q tests/python/test_import_cracmm2.py
          tests/integration/solver_benchmark/test_extended_mechanisms.py::test_cracmm2_is_pinned_to_epa_source_and_preserves_multiphase_catalog
      - name: Emit the CRACMM2 host API used by the coupled test
        env:
          PYTHONPATH: src
        run: >-
          python3 -m mkpp.cli compile mechanisms/openatmos/cracmm2/mechanism.json
          --test-env example_env.yaml --out build-host-api --host-api --no-cache
      - name: Configure the host adapter and independent Fortran references
        run: >-
          cmake -S . -B build-lite -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DKokkos_ROOT=/opt/kokkos -DBUILD_TESTING=ON
          -DMKPP_ENABLE_CRACMM2_ISORROPIA_LITE=ON -DMKPP_TEST_LITE_FORTRAN=ON
          -DMKPP_CRACMM2_HOST_API_DIR="$PWD/build-host-api"
          -DMKPP_CMAQ_ISORROPIA_II_DIR="$PWD/cmaq-reference/CCTM/src/aero/aero6"
          -DMKPP_EPFL_ISORROPIA_II_DIR="$PWD/epfl-ii-reference/iso_2_3Src"
      - name: Build the thermodynamics checks
        run: cmake --build build-lite --target cracmm2_inorganic_checks e2e_cracmm2_runner --parallel 2
      - name: Run thermodynamics checks
        run: ctest --test-dir build-lite -R 'CRACMM2Inorganic_|cracmm2_generated_host_thermodynamics|cracmm2_(cmaq|epfl)_ii_|E2ESolver_cracmm2' --verbose --no-tests=error
